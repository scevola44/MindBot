name: .NET CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MindBot.slnx

      - name: Build
        run: dotnet build MindBot.slnx --configuration Release --no-restore

      # IngestPersistenceTests applies the migration to a real SQLite file (see Migration_CreatesAWorkingSchema),
      # so a model/snapshot mismatch fails the build here instead of at container startup.
      - name: Test
        run: dotnet test MindBot.slnx --configuration Release --no-build
